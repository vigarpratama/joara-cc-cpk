# Joara Delivery — arsitektur microservice
# 3 layanan (masing-masing 1 container) + 3 database PostgreSQL (masing-masing 1 container, terpisah).
services:
  user-db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: joara_users, POSTGRES_USER: joara, POSTGRES_PASSWORD: "${DB_PASSWORD:-joara123}" }
    volumes: [ "user-db-data:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U joara -d joara_users"], interval: 5s, timeout: 3s, retries: 10 }

  order-db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: joara_orders, POSTGRES_USER: joara, POSTGRES_PASSWORD: "${DB_PASSWORD:-joara123}" }
    volumes: [ "order-db-data:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U joara -d joara_orders"], interval: 5s, timeout: 3s, retries: 10 }

  payment-db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: joara_payments, POSTGRES_USER: joara, POSTGRES_PASSWORD: "${DB_PASSWORD:-joara123}" }
    volumes: [ "payment-db-data:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U joara -d joara_payments"], interval: 5s, timeout: 3s, retries: 10 }

  user-service:
    build: ./user-service
    ports: [ "3001:3001" ]
    environment:
      DATABASE_URL: "postgres://joara:${DB_PASSWORD:-joara123}@user-db:5432/joara_users"
      JWT_SECRET: "${JWT_SECRET:-ganti-secret-ini}"
      APP_KEY: "${APP_KEY:-ganti-app-key}"
      SEED_DEMO: "${SEED_DEMO:-true}"
    depends_on: { user-db: { condition: service_healthy } }

  order-service:
    build: ./order-service
    ports: [ "3002:3002" ]
    environment:
      DATABASE_URL: "postgres://joara:${DB_PASSWORD:-joara123}@order-db:5432/joara_orders"
      JWT_SECRET: "${JWT_SECRET:-ganti-secret-ini}"
      INTERNAL_KEY: "${INTERNAL_KEY:-ganti-internal-key}"
    depends_on: { order-db: { condition: service_healthy } }

  payment-service:
    build: ./payment-service
    ports: [ "3003:3003" ]
    environment:
      DATABASE_URL: "postgres://joara:${DB_PASSWORD:-joara123}@payment-db:5432/joara_payments"
      JWT_SECRET: "${JWT_SECRET:-ganti-secret-ini}"
      INTERNAL_KEY: "${INTERNAL_KEY:-ganti-internal-key}"
      ORDER_SERVICE_URL: "http://order-service:3002"
      PAYMENT_PROVIDER: "${PAYMENT_PROVIDER:-mock}"
      MIDTRANS_SERVER_KEY: "${MIDTRANS_SERVER_KEY:-}"
      MIDTRANS_BASE_URL: "${MIDTRANS_BASE_URL:-https://api.sandbox.midtrans.com}"
    depends_on:
      payment-db: { condition: service_healthy }
      order-service: { condition: service_started }

volumes:
  user-db-data:
  order-db-data:
  payment-db-data:
